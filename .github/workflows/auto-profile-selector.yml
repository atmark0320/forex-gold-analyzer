
name: auto-profile-selector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recommend-profile:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: プロファイル候補を評価
        run: python auto_profile_selector.py

      - name: 結果を保存
        uses: actions/upload-artifact@v4
        with:
          name: auto-profile-recommendation
          path: auto_profile_recommendation.json