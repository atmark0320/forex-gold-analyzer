name: forex-gold-analyzer

on:
  # Dukascopy standard 4H candles are UTC anchored. Run 5 minutes after
  # each 4H boundary so the newly closed candle is available.
  schedule:
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: forex-gold-analyzer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt
          pip check

      - name: 自動テスト
        run: python -m unittest discover -s tests -v

      - name: 4H確定時のテクニカル戦略を生成
        run: python strategy_runner.py

      - name: 新しい4H分析がある場合のみTelegramへ送信
        if: success() && hashFiles('notify_payloads.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_to_telegram.py

      - name: 失敗時にTelegramへエラー通知
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="⚠️ forex-gold-analyzerの実行でエラーが発生しました。詳細ログ: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}"
