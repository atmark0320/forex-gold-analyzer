name: forex-gold-analyzer

on:
  schedule:
    - cron: "5 18 * * 1-5"
    - cron: "5 0 * * 1-5"
    - cron: "5 6 * * 1-5"
    - cron: "5 12 * * 1-5"
  workflow_dispatch: {}

# Prevent overlapping runs from racing on main.
concurrency:
  group: forex-gold-analyzer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt
          pip check

      - name: 自動テスト
        run: python -m unittest discover -s tests -v

      - name: テクニカル戦略を生成
        run: python strategy_runner.py

      - name: Telegramへ送信
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_to_telegram.py

      - name: 失敗時にTelegramへエラー通知
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="⚠️ forex-gold-analyzerの実行でエラーが発生しました。詳細ログ: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}"
