name: strategy-validation

on:
  push:
    branches: [main]
    paths:
      - "technical_engine.py"
      - "market_data_provider.py"
      - "backtest_strategy.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validation.yml"
  schedule:
    - cron: "20 18 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: strategy-validation
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FOREX_DATA_REFRESH_DAYS: "0"
      DUKASCOPY_BATCH_SIZE: "2"
      DUKASCOPY_BATCH_PAUSE_MS: "5000"
      DUKASCOPY_RETRY_PAUSE_MS: "10000"
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pythonをセットアップ
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Node.jsをセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 市場データキャッシュを復元
        id: market-cache-restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.4
        with:
          path: .cache/market_data
          key: dukascopy-h1-v2-${{ github.run_id }}
          restore-keys: |
            dukascopy-h1-v2-

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt
          pip check

      - name: ユニットテスト
        run: python -m unittest discover -s tests -v

      - name: USD/JPY・XAU/USD・主要通貨ペア バックテスト
        timeout-minutes: 330
        shell: bash
        run: |
          set -o pipefail
          python -u backtest_strategy.py | tee backtest_results.json

      - name: 市場データキャッシュを保存
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.4
        with:
          path: .cache/market_data
          key: dukascopy-h1-v2-${{ github.run_id }}

      - name: バックテスト結果を保存
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strategy-validation-results
          path: backtest_results.json
          retention-days: 14
