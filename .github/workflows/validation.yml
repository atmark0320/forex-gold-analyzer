name: strategy-validation

on:
  push:
    branches: [main]
    paths:
      - "technical_engine.py"
      - "market_data_provider.py"
      - "backtest_strategy.py"
      - "oos_validation.py"
      - "strategy_candidates.py"
      - "strategy_runner.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validation.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: strategy-validation
  cancel-in-progress: false

jobs:
  backtest-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOREX_DATA_REFRESH_DAYS: "0"
      DUKASCOPY_BATCH_SIZE: "2"
      DUKASCOPY_BATCH_PAUSE_MS: "5000"
      DUKASCOPY_RETRY_PAUSE_MS: "10000"
      BACKTEST_DAYS: "730"
      OOS_DAYS: "180"
      BACKTEST_SYMBOLS: "USDJPY,XAUUSD,EURUSD,GBPUSD,AUDUSD,USDCAD,USDCHF"

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Pythonをセットアップ
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Node.jsをセットアップ
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: 市場データキャッシュを復元
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.4
        with:
          path: .cache/market_data
          key: dukascopy-h1-v2-${{ github.run_id }}
          restore-keys: |
            dukascopy-h1-v2-

      - name: 依存パッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt
          pip check

      - name: ユニットテスト
        run: python -m unittest discover -s tests -v

      - name: 730日バックテスト（全7銘柄）
        timeout-minutes: 35
        shell: bash
        run: |
          set -o pipefail
          python -u backtest_strategy.py | tee backtest.log
          test -s backtest_results.json
          cp backtest_results.json backtest_730_results.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("backtest_results.json").read_text(encoding="utf-8"))
          expected = ["USDJPY", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "USDCAD", "USDCHF"]
          assert [row["symbol"] for row in data] == expected, data
          required = ["trades", "wins", "losses", "win_rate_pct", "total_r", "expectancy_r", "profit_factor", "max_drawdown_r", "max_consecutive_losses"]
          for row in data:
              assert all(k in row for k in required), row
              assert row["trades"] == row["wins"] + row["losses"], row
              assert row["trades"] > 0, row
          print("RESULT_VALID", data)
          PY

      - name: 180日OOSバックテスト（全7銘柄・同一条件）
        timeout-minutes: 35
        shell: bash
        run: |
          set -o pipefail
          python -u oos_validation.py | tee oos.log
          test -s oos_results.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("oos_results.json").read_text(encoding="utf-8"))
          expected = ["USDJPY", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "USDCAD", "USDCHF"]
          assert [row["symbol"] for row in data] == expected, data
          for row in data:
              assert row["evaluation"] == "out_of_sample", row
              assert row["trades"] == row["wins"] + row["losses"], row
              assert row["oos_days"] == 180, row
          print("OOS_RESULT_VALID", data)
          PY

      - name: 戦略候補OOS比較（18条件×全7銘柄）
        timeout-minutes: 35
        shell: bash
        run: |
          set -o pipefail
          python -u strategy_candidates.py | tee strategy_candidates.log
          test -s strategy_candidates_oos.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("strategy_candidates_oos.json").read_text(encoding="utf-8"))
          expected_symbols = ["USDJPY", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "USDCAD", "USDCHF"]
          expected_variants = [
              "baseline", "stricter_confirmation", "wider_target", "faster_target", "wider_stop", "larger_entry_buffer",
              "stricter_faster_target", "stricter_larger_buffer", "faster_larger_buffer", "stricter_faster_larger_buffer",
              "adx25_gate", "adx22_gate", "adx25_faster_target", "full_alignment", "full_alignment_faster_target", "full_alignment_adx25",
              "adx25_rising", "adx25_rising_faster_target",
          ]
          assert len(data) == 126, len(data)
          assert sorted({row["symbol"] for row in data}) == sorted(expected_symbols)
          assert sorted({row["variant"] for row in data}) == sorted(expected_variants)
          for row in data:
              assert row["evaluation"] == "out_of_sample", row
              assert row["trades"] == row["wins"] + row["losses"], row
          print("CANDIDATE_RESULT_VALID rows=126")
          PY

      - name: 市場データキャッシュを保存
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.4
        if: always()
        with:
          path: .cache/market_data
          key: dukascopy-h1-v2-${{ github.run_id }}

      - name: バックテスト結果を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: strategy-validation-results
          path: |
            backtest_730_results.json
            oos_results.json
            backtest.log
            oos.log
            strategy_candidates_oos.json
            strategy_candidates.log
